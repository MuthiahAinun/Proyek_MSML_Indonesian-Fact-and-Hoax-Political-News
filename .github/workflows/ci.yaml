name: Train and Deploy RF Hoax Model

on:
  push:
    paths:
      - 'Model/**'
      - '.github/workflows/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: Model/conda.yaml
          environment-name: rf_hoax_env
          init-shell: bash
          cache-downloads: true
          cache-environment: true

      - name: Run MLflow project (train and log)
        shell: micromamba-shell {0}
        run: |
          mlflow run Model/ --env-manager=local

      - name: Build Docker image
        shell: micromamba-shell {0}
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          mlflow models build-docker -m mlruns/0/*/artifacts/rf_model -n rf-hoax-model

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag rf-hoax-model ${{ secrets.DOCKERHUB_USERNAME }}/rf-hoax-model:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rf-hoax-model:latest
