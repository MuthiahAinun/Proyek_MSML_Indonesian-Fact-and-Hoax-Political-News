name: MLflow CI

on:
  push:
    paths:
      - '.github/workflows/ci.yaml'
      - 'Model/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          pip install mlflow
          pip install torch transformers scikit-learn pandas

      - name: Run MLflow project
        run: |
          mlflow run Model/ -P stages=train

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: mlruns

      - name: Upload last run ID
        uses: actions/upload-artifact@v4
        with:
          name: run-id
          path: Model/last_run_id.txt

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install MLflow
        run: pip install mlflow

      - name: Download last_run_id
        uses: actions/download-artifact@v4
        with:
          name: run-id
          path: run_id_info

      - name: Read run ID
        id: read_run
        run: |
          RUN_ID=$(cat run_id_info/last_run_id.txt)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Build Docker image from MLflow model
        run: |
          mlflow models build-docker -m mlruns/0/$RUN_ID/artifacts/model -n muthiah192/hoax-detector:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag muthiah192/hoax-detector:latest muthiah192/hoax-detector:${{ github.run_number }}
          docker push muthiah192/hoax-detector:latest
          docker push muthiah192/hoax-detector:${{ github.run_number }}
