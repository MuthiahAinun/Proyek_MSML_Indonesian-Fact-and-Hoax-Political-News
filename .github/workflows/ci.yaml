name: MLflow CI

on:
  push:
    paths:
      - '.github/workflows/ci.yaml'
      - 'Model/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Mambaforge
        uses: conda-incubator/setup-miniconda@v2
        with:
          python-version: 3.9
          use-mamba: true
          auto-update-conda: true
          auto-activate-base: false

      - name: Install MLflow (global)
        shell: bash
        run: |
          pip install mlflow

      - name: Run MLflow Project with conda
        shell: bash
        run: |
          cd Model  # Pastikan berada di dalam folder Model/
          mlflow run . --env-manager=conda  # Menjalankan project MLflow dari folder Model/

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: Model/mlruns  # Pastikan path mlruns ada di dalam folder Model/

      - name: Upload last run ID
        uses: actions/upload-artifact@v4
        with:
          name: run-id
          path: Model/last_run_id.txt  # Path untuk menyimpan run-id

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install MLflow
        run: pip install mlflow

      - name: Download MLflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: mlflow-artifacts
          path: Model/mlruns  # Pastikan mengunduh artefak dari folder Model/

      - name: Download run ID file
        uses: actions/download-artifact@v4
        with:
          name: run-id
          path: Model/run_id_info  # Menyimpan run-id untuk digunakan pada langkah berikutnya

      - name: Read run ID
        id: read_run
        run: |
          echo "RUN_ID=$(cat Model/run_id_info/last_run_id.txt)" >> $GITHUB_ENV  # Membaca run-id dan menyimpannya ke environment variable

      - name: Build Docker image from MLflow model
        run: |
          mlflow models build-docker -m Model/mlruns/0/${{ env.RUN_ID }}/artifacts/model -n muthiah192/hoax-detector:latest  # Membuat Docker image dari model

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag muthiah192/hoax-detector:latest muthiah192/hoax-detector:${{ github.run_number }}
          docker push muthiah192/hoax-detector:latest
          docker push muthiah192/hoax-detector:${{ github.run_number }}
