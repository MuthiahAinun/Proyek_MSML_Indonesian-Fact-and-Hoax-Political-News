name: MLflow CI

on:
  push:
    paths:
      - '.github/workflows/ci.yaml'
      - 'Model/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Conda with Mambaforge and Create Environment
        uses: conda-incubator/setup-miniconda@v2
        with:
          environment-file: Model/conda.yaml
          environment-name: hoax-env
          python-version: 3.9
          use-mamba: true
          auto-update-conda: true
          auto-activate-base: false

      - name: Run MLflow project using existing conda env
        shell: bash
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          conda activate hoax-env
          cd Model
          mlflow run . --env-manager=local --no-conda
          RUN_ID=$(ls -td mlruns/0/* | head -1 | xargs -n 1 basename)
          echo "$RUN_ID" > last_run_id.txt

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: Model/mlruns

      - name: Upload last run ID
        uses: actions/upload-artifact@v4
        with:
          name: run-id
          path: Model/last_run_id.txt

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install MLflow
        run: pip install mlflow

      - name: Download MLflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: mlflow-artifacts
          path: Model/mlruns

      - name: Download run ID file
        uses: actions/download-artifact@v4
        with:
          name: run-id
          path: Model/run_id_info

      - name: Read run ID
        id: read_run
        run: echo "RUN_ID=$(cat Model/run_id_info/last_run_id.txt)" >> $GITHUB_ENV

      - name: Build Docker image from MLflow model
        run: |
          mlflow models build-docker -m Model/mlruns/0/${{ env.RUN_ID }}/artifacts/model -n muthiah192/hoax-detector:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag muthiah192/hoax-detector:latest muthiah192/hoax-detector:${{ github.run_number }}
          docker push muthiah192/hoax-detector:latest
          docker push muthiah192/hoax-detector:${{ github.run_number }}
