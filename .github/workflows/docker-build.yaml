name: Build and Push Docker Image

on:
  push:
    branches:
      - main  
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install MLflow
      run: pip install mlflow

    - name: Download MLflow model artifact from DagsHub
      run: |
        curl -L "https://dagshub.com/MuthiahAinun/distilbert-hoax-detection.mlflow/artifacts/0/b0444424210e48c9a4f1c98188861c9d/artifacts/model.zip" --output model.zip
        unzip model.zip -d mlflow_model

    - name: Build Docker Image from MLflow Model
      run: |
        mlflow models build-docker \
          -m mlflow_model/model \
          -n distilbert-hoax-classifier

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image to DockerHub
      run: |
        docker tag distilbert-hoax-classifier ${{ secrets.DOCKERHUB_USERNAME }}/distilbert-hoax-classifier:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/distilbert-hoax-classifier:latest
